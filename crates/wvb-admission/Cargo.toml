[package]
name = "wvb-admission"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-authority = ["dep:serde_jcs", "dep:serde_json", "dep:wvb-receipt"]

[dependencies]
serde.workspace = true
serde_jcs = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wvb-authz = { path = "../wvb-authz" }
wvb-integrity = { path = "../wvb-integrity" }
wvb-receipt = { path = "../wvb-receipt", optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
wvb-state = { path = "../wvb-state" }

[lints]
workspace = true

[[test]]
name = "frozen_handoff_v1"
required-features = ["test-authority"]

[[test]]
name = "scalar_test_authority"
required-features = ["test-authority"]
