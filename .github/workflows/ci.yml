name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-portable.sh
  windows-real-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./tests/windows-roundtrip.ps1
